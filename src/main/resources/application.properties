# ====================================================================
# NetTrack Spring Boot & MySQL Configuration
# ====================================================================

spring.application.name=nettrack-backend
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nettrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate ORM Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable automatic SQL script execution (Hibernate creates tables automatically)
spring.sql.init.mode=never

# Simulation engine settings
nettrack.simulation.ns2-executable=ns
nettrack.simulation.tcl-dir=ns2_simulations/
nettrack.simulation.awk-dir=awk_scripts/
