version: '3.8'

services:
  # MySQL 8.0 Database Container
  mysql:
    image: mysql:8.0
    container_name: nettrack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nettrack_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # Java Spring Boot Backend + Web Dashboard Container
  backend:
    build: .
    container_name: nettrack-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/nettrack_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes:
  mysql-data:
